# Mosquitto MQTT Broker Configuration
# Following official best practices for Home Assistant

# Listener configuration
listener 1883
allow_anonymous false

# WebSocket support (for Home Assistant MQTT integration)
listener 9001
protocol websockets
allow_anonymous false

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Security: Password file
password_file /mosquitto/config/passwd

# Connection settings for stability
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Message settings
max_packet_size 1048576

# QoS settings for reliable delivery
upgrade_outgoing_qos false

# Retained messages (important for device state)
retained_persistence true

