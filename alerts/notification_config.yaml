# Home Assistant Notification Configuration
# Telegram Bot + Notifier Setup (YAML Configuration)
# Location: /home/system/homeassistant/config/notification_config.yaml
# Include in configuration.yaml: notification_config: !include notification_config.yaml
#
# This file contains both telegram_bot and notify configurations
# Both must be in YAML (not UI) for the notify service to work properly

# ============================================================================
# TELEGRAM BOT CONFIGURATION
# ============================================================================
telegram_bot:
  - platform: polling
    api_key: "8375553299:AAG7tKD2JmXMSL7-Eh-r0ZHDwsdA8Z1i_wQ"
    allowed_chat_ids:
      - 439885937

# ============================================================================
# TELEGRAM NOTIFIER
# ============================================================================
notify:
  - name: telegram_notifier
    platform: telegram
    chat_id: 439885937
  - name: multi_channel_alerts
    platform: group
    services:
      - service: mobile_app_22071212ag
      - service: telegram_notifier
